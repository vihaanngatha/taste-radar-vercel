<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rate a few games or movies, then check any title against your own taste.">
<link rel="preconnect" href="https://upload.wikimedia.org">
<title>Taste Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a full-screen drifting mosaic of title posters (the field), with glass panels floating over it:
   taste on the left, verdicts on the right, the question at the bottom. One deliberate dark look: a cinema at night. */
:root{
 --bg:#111417;          /* the dark between posters */
 --panel:rgba(20,24,28,.82);
 --panel-solid:#171b1f;
 --line:#2a3137;
 --fg:#ece6da;          /* projector white */
 --mut:#8e959b;
 --acc:#7fdcc8;         /* this title / selection */
 --warm:#f0a35e;        /* your closest title */
 --yes:#66d6c0;--likely:#a6c264;--maybe:#e2a43e;--skip:#d65a43;
 --disp:"Archivo","Arial Narrow",system-ui,sans-serif;
 --body:"Archivo",system-ui,sans-serif;
 color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);font-stretch:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
#field{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#field.pan{cursor:grabbing}
#veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(8,10,12,.75) 100%);transition:background .5s}
body.calib #veil{background:radial-gradient(90% 75% at 60% 45%,transparent 30%,rgba(8,10,12,.6) 100%)}
.ic{display:inline-flex;vertical-align:middle}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;
 padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 background:linear-gradient(rgba(10,12,14,.85),rgba(10,12,14,0));pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-family:var(--disp);font-stretch:62%;font-weight:850;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{font-style:normal;color:var(--acc)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.seg button{border:0;background:none;color:var(--mut);padding:7px 14px;border-radius:99px;font-weight:600}
.seg button.on{background:var(--fg);color:var(--bg)}
.seg .sm{display:none}.brand{white-space:nowrap}
.ghost{background:none;border:1px solid transparent;color:var(--mut);padding:8px 10px;border-radius:99px;font-size:13px}
.ghost:hover{color:var(--fg);border-color:var(--line)}
#tasteBtn{display:none}

/* ---------- shared controls ---------- */
button,input{font:inherit;color:var(--fg)}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--mut)}
.btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.go{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut);font-size:14px}
.disp{font-family:var(--disp);font-stretch:62%;font-weight:850;text-transform:uppercase;line-height:.92;letter-spacing:.005em;text-wrap:balance}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.sec{display:flex;flex-direction:column;gap:12px;padding:20px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec.row{flex-direction:row}
.h2{font-family:var(--disp);font-stretch:75%;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}

/* ---------- taste dock (left) ---------- */
#dock{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));top:calc(72px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 96px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.arch{display:flex;align-items:center;gap:10px;font-size:34px}
.arch .ic{color:var(--acc)}
.dna{display:flex;align-items:flex-end;gap:6px;height:118px}
.blk{flex:1;min-width:0;border-radius:8px 8px 3px 3px;padding:8px 4px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;color:#0e1114;text-align:center;position:relative;overflow:hidden}
.blk .ic{color:#0e1114;opacity:.8}
.blk.lt,.blk.lt .ic{color:var(--fg)}
.bl{font-size:10px;font-weight:800;line-height:1.1;text-transform:uppercase;font-stretch:62%;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl2{font-size:9.5px;font-weight:600;opacity:.75;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.chip.g{border-color:color-mix(in srgb,var(--yes) 55%,transparent);color:var(--yes)}
.chip.r{border-color:color-mix(in srgb,var(--skip) 60%,transparent);color:var(--skip)}

/* ---------- question bar (bottom) ---------- */
#ask{position:fixed;z-index:6;left:388px;right:24px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;transition:right .35s}
body.sheet-open #ask{right:484px}
.askbar{display:flex;gap:6px;align-items:center;padding:6px;border-radius:18px;width:100%;max-width:640px}
.askbar input{flex:1;min-width:0;background:none;border:0;padding:12px 12px;font-size:16px;outline:none}
.askbar input::placeholder{color:var(--mut)}
.askbar .btn{white-space:nowrap}
.hint{position:fixed;z-index:3;left:388px;right:24px;bottom:calc(92px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:var(--mut);pointer-events:none;transition:opacity .3s}
body.sheet-open .hint{opacity:0}

/* ---------- verdict sheet (right) ---------- */
#sheet{position:fixed;z-index:7;right:max(16px,env(safe-area-inset-right,0px));top:calc(72px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:452px;overflow:auto;transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
body.sheet-open #sheet{transform:none}
.close{position:sticky;top:10px;float:right;margin:10px 10px -46px 0;z-index:2;width:36px;height:36px;border-radius:99px;border:1px solid var(--line);background:var(--panel-solid);color:var(--mut);display:grid;place-items:center}
.vtitle{font-size:52px}
.verdict{font-family:var(--disp);font-stretch:75%;font-weight:800;font-size:22px;line-height:1.15;text-wrap:balance}
.stats{display:flex;gap:8px}
.stat{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--disp);font-stretch:62%;font-weight:850;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.gauge{display:flex;justify-content:center}
.gauge svg{width:100%;max-width:300px;height:auto;color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;padding:4px 2px}
.tile{border-radius:14px;padding:14px 10px 10px;text-align:center;transform:rotate(-1.4deg);border:1px solid;display:flex;flex-direction:column;align-items:center;gap:3px}
.tile:nth-child(even){transform:rotate(1.2deg)}
.tile.ok{background:linear-gradient(160deg,#1c5a51,#10302c);border-color:color-mix(in srgb,var(--yes) 60%,transparent)}
.tile.no{background:linear-gradient(160deg,#5e2a1f,#2c1410);border-color:color-mix(in srgb,var(--skip) 60%,transparent)}
.tn{font-family:var(--disp);font-stretch:75%;font-weight:800;text-transform:uppercase;font-size:16px}
.ts{font-size:12px;color:color-mix(in srgb,var(--fg) 75%,transparent);line-height:1.3}
.tb{margin-top:6px;font-size:10.5px;font-weight:800;letter-spacing:.16em}
.tile.ok .tb{color:var(--yes)}.tile.no .tb{color:var(--skip)}
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.post{aspect-ratio:2/3;max-width:100%;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.post .pt{font-family:var(--disp);font-stretch:62%;font-weight:850;text-transform:uppercase;font-size:17px;line-height:.95;word-break:break-word}
.post .ic{color:rgba(236,230,218,.85)}
.radar svg{width:100%;height:auto;display:block;color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut)}
.k{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px}
.cmp .n{color:var(--fg);font-weight:600}
.cmp .v{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12.5px}
.bars{grid-column:1/-1;display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.bar.a i{background:var(--warm)}
.near{display:flex;align-items:center;gap:8px;font-size:14px}
.rec{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec .sc{grid-row:span 3;font-family:var(--disp);font-stretch:62%;font-weight:850;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--acc)}
.rec .t{font-weight:700}
.rec .row .mut{font-size:12px}
.rec .rr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:4px}
.rec .rr .mut{grid-column:1/-1;font-size:12px}
.rec .btn{padding:6px 4px;font-size:12px;border-radius:9px;justify-content:center;gap:4px}

/* ---------- taste check (calibration) ---------- */
#app{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));top:calc(72px + env(safe-area-inset-top,0px));width:400px;max-height:calc(100% - 96px);overflow:auto}
.dots{display:flex;gap:6px}
.dot{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mut);display:grid;place-items:center;font-weight:700;font-size:13px;padding:0}
.dot.on{border-color:var(--fg);color:var(--fg)}
.dot.done{color:var(--acc)}
.ctitle{font-size:60px}
.react{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calseg{align-self:flex-start;max-width:100%}.calseg button{font-size:13px}
.chip.mine{color:var(--fg);display:inline-flex;align-items:center;gap:5px}
.chip.wait{opacity:.6}
.react .btn{justify-content:center;padding:14px 10px;font-size:15px}
.skip{align-self:flex-start}

/* ---------- status ---------- */
#st{position:fixed;z-index:9;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(520px,calc(100% - 32px));background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--fg);box-shadow:0 12px 40px rgba(0,0,0,.5)}
#st:empty{display:none}
#st:not(:empty)::before{content:"";display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--acc);margin-right:8px;vertical-align:1px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
/* ---------- the opening: glass, question, emergence ---------- */
.introbox,#intro{position:fixed;inset:0;z-index:8;display:grid;place-items:center;overflow:auto;padding-block:96px 32px;
 padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
 background:radial-gradient(120% 90% at 50% 40%,rgba(13,16,19,.86),rgba(9,11,13,.97))}
.curtain{pointer-events:none;z-index:9}
body.intro .seg,body.intro #tf,body.intro #tasteBtn{visibility:hidden}
#glass{position:fixed;left:0;top:0;z-index:30;outline:none;touch-action:none;background:transparent}
.moshi{position:fixed;inset:0;z-index:31;display:grid;place-items:center;pointer-events:none;padding-inline:16px;transition:opacity .35s,transform .5s cubic-bezier(.2,.8,.2,1)}
.moshi span{font-family:"Cormorant Garamond","Cormorant",Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(54px,8.6vw,132px);line-height:1;letter-spacing:.005em;color:#efe9de;text-align:center;
 text-shadow:0 1px 0 rgba(0,0,0,.55),0 10px 40px rgba(0,0,0,.65)}
.moshi.gone{opacity:0;transform:scale(1.04)}
.moshibg{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 90% at 40% 30%,#1a1d21,#0b0d10);transition:opacity .45s;cursor:pointer}
body.opening #intro .q2{opacity:0}
#intro .q2{transition:opacity .5s ease}

.hellofb{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#050507;transition:opacity .35s;cursor:pointer;padding:24px}
.hfb-in{width:min(900px,100%);padding:clamp(28px,6vw,72px);border-radius:20px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(170deg,#1a1a1f,#101013);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;gap:14px;font-family:Inter,"Helvetica Neue",Arial,sans-serif}
.hfb-eye{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.38)}
.hfb-h{font-size:clamp(72px,14vw,180px);font-weight:500;letter-spacing:-.045em;line-height:.95;color:#d4d4d9}
.hfb-sub{color:rgba(255,255,255,.55);font-size:17px}
.hfb-pill{align-self:flex-start;margin-top:8px;background:#ececf0;color:#0b0c0e;border-radius:6px;padding:10px 26px;font-weight:600}
.glasshint{display:none;position:fixed;z-index:31;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;
 font-size:11px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:rgba(236,230,218,.42);opacity:0;transition:opacity 1.2s}
.glasshint.on{opacity:1}
.q2{width:100%;max-width:900px;display:flex;flex-direction:column;gap:14px}
.serifq{margin:0;font-family:"Cormorant Garamond","Cormorant",Georgia,serif;font-weight:300;font-size:clamp(42px,6.4vw,84px);line-height:1;letter-spacing:-.01em;text-wrap:balance;color:var(--fg)}
.serifq em{font-style:italic}
.qsub{margin:0;color:var(--mut);font-size:15px}
.panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:22px}
.pane{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:min(46vh,340px);padding:26px 26px 24px;
 border-radius:3px;border:1px solid rgba(236,230,218,.14);background:linear-gradient(165deg,rgba(255,255,255,.045),rgba(255,255,255,.008) 55%,rgba(0,0,0,.18));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 60px rgba(0,0,0,.35);transition:border-color .35s,transform .35s}
.pane::after{content:"";position:absolute;inset:-20%;background:linear-gradient(112deg,transparent 42%,rgba(255,255,255,.075) 50%,transparent 58%);transform:translateX(-70%);transition:transform 1.1s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.pane:hover,.pane:focus-visible{border-color:rgba(236,230,218,.4);transform:translateY(-3px)}
.pane:hover::after,.pane:focus-visible::after{transform:translateX(70%)}
.pane.chosen{border-color:rgba(236,230,218,.7)}
.pw{font-family:"Cormorant Garamond","Cormorant",Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(56px,7vw,92px);line-height:.9;color:var(--fg)}
.pm{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.pd{color:rgba(236,230,218,.72);font-size:14.5px;line-height:1.45;max-width:34ch}
@media (max-width:700px){.introbox,#intro{padding-block:76px 24px;place-items:start center}.pane{min-height:0;padding:20px}.panes{gap:12px;margin-top:12px}.pw{font-size:54px}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
/* ---------- taste check extras ---------- */
.row.between{justify-content:space-between}
.ghost.tiny{font-size:12px;padding:4px 8px}
.calseg button{font-size:12.5px;padding:7px 10px}
.sliders{display:flex;flex-direction:column;gap:10px}
.sl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.sln{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.slv{font-variant-numeric:tabular-nums;font-family:var(--disp);font-stretch:62%;font-weight:850;font-size:22px;color:var(--acc)}
.sl.untouched .slv{color:var(--mut)}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.sl.untouched input{opacity:.55}
.rater{display:flex;flex-direction:column;gap:10px}
.calsearch{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.calsearch:focus{border-color:var(--acc)}
.results{display:flex;flex-direction:column;gap:4px}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:9px 12px}
.res:hover,.res:focus-visible{border-color:var(--line);background:rgba(255,255,255,.03)}
.res .rn{font-weight:600}
.res.any .rn{color:var(--acc)}
.picks{display:flex;flex-direction:column;gap:8px}
.recseg{align-self:flex-start}
.pq{font-size:34px}
.duel{display:flex;flex-direction:column;gap:10px}
.duel.in{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:border-color .15s,transform .15s}
.pick .ic{color:var(--acc)}
.pick:hover,.pick:focus-visible{border-color:var(--acc);transform:translateY(-1px)}
.pt2{font-family:var(--disp);font-stretch:75%;font-weight:800;font-size:21px;line-height:1.1;text-transform:uppercase}
.vs{align-self:center;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.deals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.deals .btn{justify-content:center;padding:12px 8px}
@media (prefers-reduced-motion:reduce){.pane,.pane::after{transition:none}}
.skel{border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.11) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:shim 1.1s linear infinite}
.skel.g{height:140px;width:100%;max-width:280px;align-self:center;border-radius:140px 140px 14px 14px}
.skel.l{height:14px}.skel.s{width:60%}
@keyframes shim{to{background-position:-200% 0}}

/* ---------- phone ---------- */
@media (max-width:899px){
 .brand{font-size:20px;gap:6px}.top{gap:6px}.ghost{padding:8px 4px}
 .seg button{padding:6px 10px;font-size:13px}
 #tasteBtn{display:inline-flex;white-space:nowrap}
 .seg .lg{display:none}.seg .sm{display:inline}
 #tf{display:none}body.taste-open #tf{display:inline-flex}
 #dock{left:8px;right:8px;width:auto;top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-height:62%;transform:translateY(calc(100% + 120px));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
 body.taste-open #dock{transform:none}
 #ask{left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
 body.sheet-open #ask{right:8px}
 .hint{left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px))}

  if(r.ok){const x=d.result;if(d.backup&&x&&typeof x==="object")x.__backup=true;return x}
  // Busy or rate-limited: wait a few seconds and try once more before giving up.
  if(attempt===0&&(r.status===503||r.status===429)){await new Promise(w=>setTimeout(w,5000));continue}

const MOVIE_RULES=g=>`QUALITY RULES, strict: only suggest movies and shows with genuinely excellent reception from both audiences and critics: roughly IMDb 7.5 or higher from a large number of voters (tens of thousands or more), and strong critical reception (for example Rotten Tomatoes 75% or more where it exists). Never suggest mediocre, average or poorly reviewed titles, even if they match the genre. Include both Hollywood and Bollywood. Bollywood and other Indian titles must be widely recognised, well-established and acclaimed by audiences and critics (roughly IMDb 7.8 or higher with many votes): never obscure, little-known or poorly received ones. ${g?"Hidden gems here means acclaimed titles outside the biggest blockbusters and franchises, still well rated by many viewers, not obscure ones. ":""}Fewer excellent titles is better than any filler. Use the exact official title and the release year (the first season’s year for a show) so the ratings can be checked.`;

// ---------- the poster wall (visual layer; clicking a title runs the same check as typing it) ----------
// Poster-shaped tiles in staggered columns, bent like the inside of a sphere: big in the middle,

const MZ=(()=>{
 const cv=$("#field"),cx=cv.getContext("2d"),RM=matchMedia("(prefers-reduced-motion: reduce)").matches;

 const FONT=(w,s)=>w+" condensed "+s+"px Archivo, 'Arial Narrow', sans-serif";
 const z0=()=>wide()?W/(6.4*SX):W/(2.6*SX);

 // The wall wraps around in both directions, so it never ends. worldW/worldH are one full turn.

  free.sort((a,b)=>a[2]-b[2]);list.forEach((x,i)=>place.set(x.n,[free[i][0],free[i][1]]));

   let fs=Math.min(w*.2,46),L;for(let i=0;i<8;i++){cx.font=FONT(850,fs);L=wrap(n.toUpperCase().split(/\s+/),w*.84);if(Math.max(...L.map(l=>cx.measureText(l).width))<=w*.84&&L.length*fs*.95<=h*.62)break;fs*=.88}
   if(fs>=5){const lh=fs*.95,ty=y+h/2-L.length*lh/2+lh*.78;cx.textAlign="center";cx.fillStyle=lit?"#fff8ec":base?"rgba(236,230,218,.92)":"rgba(236,230,218,.55)";L.forEach((l,i)=>cx.fillText(l,x+w/2,ty+i*lh));
    if(mt.year&&!mt.tag&&fs*.4>=5){cx.font=FONT(700,fs*.4);cx.fillStyle="rgba(236,230,218,.5)";cx.fillText(String(mt.year),x+w/2,ty-lh)}}}
  // calm the wall: titles that aren't yours sit back, and the edges of the sphere fade
  const dim=(lit?0:base?.05:.36)+(1-k)*.9;if(dim>0){cx.fillStyle="rgba(10,12,14,"+Math.min(.85,dim)+")";cx.fillRect(x,y,w,h)}
  if(img&&lit){const fs=Math.max(8,Math.min(w*.085,17));cx.font=FONT(850,fs);const L=wrap(n.toUpperCase().split(/\s+/),w*.86).slice(0,2),lh=fs*1.05,bh=L.length*lh+fs*1.1;
   const gb=cx.createLinearGradient(0,y+h-bh*1.8,0,y+h);gb.addColorStop(0,"rgba(10,12,14,0)");gb.addColorStop(.45,"rgba(10,12,14,.85)");gb.addColorStop(1,"rgba(10,12,14,.95)");cx.fillStyle=gb;cx.fillRect(x,y+h-bh*1.8,w,bh*1.8);
   cx.fillStyle="#fff8ec";cx.textAlign="center";L.forEach((l,i)=>cx.fillText(l,x+w/2,y+h-bh+fs*.55+lh*.8+i*lh))}
  if(mt.tag){const sz=Math.max(7,Math.min(w*.06,12));cx.font=FONT(800,sz);const tw=cx.measureText(mt.tag).width+sz*1.4,th=sz*1.7;rrect(x+w/2-tw/2,y+sz*.7,tw,th,th/2);
   cx.fillStyle=mt.tone===2?"rgba(127,220,200,.95)":"rgba(10,12,14,.82)";cx.fill();cx.fillStyle=mt.tone===2?"#0e1114":"#ece6da";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(mt.tag,x+w/2,y+sz*.7+th/2+sz*.05);cx.textBaseline="alphabetic"}
  cx.restore();
  if(hot||mt.tone===2){rrect(x,y,w,h,rad);cx.lineWidth=hot?2.5:1.5;cx.strokeStyle=hot?"#ece6da":"rgba(127,220,200,.8)";cx.stroke()}}
 function draw(){
  cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle="#0d1013";cx.fillRect(0,0,W,H);
  const vis=[],used=new Set();
  const WW=worldW(),WH=worldH();
  const copies=(wx,wy,fn)=>{const bx=nc(wx,cam.x,WW),by=nc(wy,cam.y,WH);for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)fn(bx+i*WW,by+j*WH)};
  for(const[n,[c,r]]of place){used.add(c+","+r);const[wx0,wy0]=cellXY(c,r),lit=n===fx||n===hover||n===sel;
   copies(wx0,wy0,(wx,wy)=>{const[px,py,k]=proj(wx,wy),s=k*k*cam.z*(lit?1.07:1),w=TW*s,h=TH*s;
    if(px+w<0||px-w>W||py+h<0||py-h>H)return;vis.push({n,x:px-w/2,y:py-h/2,w,h,k,lit,hot:n===fx||n===sel})})}

   copies(wx0,wy0,(wx,wy)=>{const[px,py,k]=proj(wx,wy),s=k*k*cam.z,w=TW*s,h=TH*s;
    if(px+w<0||px-w>W||py+h<0||py-h>H)return;rrect(px-w/2,py-h/2,w,h,w*.07);cx.fillStyle="rgba(255,255,255,"+(.025*k)+")";cx.fill()})}
  vis.sort((a,b)=>(a.lit-b.lit)||(a.k-b.k));
  for(const v of vis)tile(v.n,v.x,v.y,v.w,v.h,v.k,v.lit,v.hot);

 function frame(ts){const dt=Math.min(50,ts-(last||ts));last=ts;idle+=dt;
  const follow=sel||fx;
  if(follow&&!ptrs.size&&place.has(follow)){const[c,r]=place.get(follow),[wx,wy]=cellXY(c,r),[ox,oy]=offset();const gx=nc(wx-ox/tgt.z,tgt.x,worldW()),gy=nc(wy-oy/tgt.z,tgt.y,worldH());tgt.x+=(gx-tgt.x)*.1;tgt.y+=(gy-tgt.y)*.1}
  else if(!RM&&!ptrs.size&&idle>4000){tgt.x+=dt*.012} // a slow, endless turn
  const WW=worldW(),WH=worldH();if(WW&&Math.abs(cam.x)>WW*3){const sh=WW*Math.round(cam.x/WW);cam.x-=sh;tgt.x-=sh}if(WH&&Math.abs(cam.y)>WH*3){const sh=WH*Math.round(cam.y/WH);cam.y-=sh;tgt.y-=sh}
  clampCam(tgt);const e=RM?1:.09;cam.x+=(tgt.x-cam.x)*e;cam.y+=(tgt.y-cam.y)*e;cam.z+=(tgt.z-cam.z)*e;

 const at=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]};
 cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;idle=0;if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});

 addEventListener("resize",()=>{const old=z0();size();const nz=z0();cam.z*=nz/old;tgt.z*=nz/old});
 size();
 // Arrow keys: left/right step to the next column (the poster nearest in height), up/down within a column.
 function move(dx,dy){idle=0;
  const occ=new Map([...place].map(([n,p])=>[p.join(","),n]));

function syncMosaic(){
 const t=S.type,seen=new Set(),list=[],add=(n,o)=>{if(!n||seen.has(n.toLowerCase()))return;seen.add(n.toLowerCase());list.push(Object.assign({n},o||{}))};

 PST.prefetch(WALL[t],t);
 if(HOT)add(HOT,{tone:1});
 prof(t).forEach(i=>add(i.n,{tag:LBL[rlev(i.r)].toUpperCase(),tone:1}));
 REC.forEach(x=>add(x.title,{tag:"PICK FOR YOU",tone:2,year:x.year}));
 const yr=Object.fromEntries(allS(t).map(r=>[r[0],r[1]]));
 WALL[t].forEach(n=>add(n,{year:yr[n]||"",tone:calibrating&&S.slots[t].includes(n)?1:0}));

 MZ.set(list);
}
// Keyboard: arrows move the highlight on the wall, Enter picks it, Esc leaves a text box.
addEventListener("keydown",e=>{const tg=e.target,typing=tg&&(tg.tagName==="INPUT"||tg.tagName==="TEXTAREA"||tg.isContentEditable);

 if(e.key==="Enter"&&MZ.selected()&&(!tg||tg===document.body)){e.preventDefault();MZ.onPick(MZ.selected())}});
MZ.onPick=n=>{if(document.body.classList.contains("calib")){if(window.CALPICK)CALPICK(n);return}const q=$("#q");if(q)q.value=n;rate(n)};
render();MZ.start();
